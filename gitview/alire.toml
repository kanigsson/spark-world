name = "git_view"
description = "Read-only Git project, source, comparison and history explorer"
version = "0.1.0-dev"

authors = ["kanig"]
maintainers = ["kanig <kanig@adacore.com>"]
maintainers-logins = ["kanig"]
licenses = "Apache-2.0"

executables = ["git_view"]
project-files = ["git_view.gpr"]

[[depends-on]]
tui = "*"
[[depends-on]]
tui_term = "*"
[[depends-on]]
git_changes = "*"

# No Alire index in this workspace; pin the sibling crates by path.
[[pins]]
tui = { path = "../libs/tui" }
[[pins]]
tui_term = { path = "../term" }
[[pins]]
git_changes = { path = "../git-changes" }
