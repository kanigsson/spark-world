[[pins]]
tui_width = { path = "../width" }
[[pins]]
tui_text = { path = "../text" }
[[pins]]
tui_pager = { path = "../pager" }
[[pins]]
tui_term = { path = "../term" }
[[pins]]
tui_app_kit = { path = "../appkit" }
[[pins]]
git_changes = { path = "../../git-changes" }
