name = "tui"
description = "Proved terminal-UI foundations for panes and pagers (no I/O)"
version = "0.1.0-dev"

authors = ["Johannes Kanig"]
maintainers = ["Johannes Kanig <johannes.kanig@gmail.com>"]
maintainers-logins = ["kanigsson"]
licenses = "Apache-2.0 WITH LLVM-exception"

project-files = ["tui.gpr"]

# No dependencies by design: nothing here touches the OS. The terminal driver
# is the separate tui_term crate, and it depends on this one, not the reverse.

[build-switches]
"*".contracts = "Yes"
