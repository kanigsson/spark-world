name = "tui_term"
description = "Terminal driver: raw mode, ANSI output, key input, signals"
version = "0.1.0-dev"

authors = ["Johannes Kanig"]
maintainers = ["Johannes Kanig <johannes.kanig@gmail.com>"]
maintainers-logins = ["kanigsson"]
licenses = "Apache-2.0 WITH LLVM-exception"

project-files = ["tui_term.gpr"]

[build-switches]
"*".contracts = "Yes"

[[depends-on]]
tui = "*"

# No Alire index in this workspace; pin the sibling crates by path.
[[pins]]
tui = { path = "../../libs/tui" }
