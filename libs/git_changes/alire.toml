name = "git_changes"
description = "Typed, source-neutral Git change sets for Ada clients"
version = "0.1.0-dev"
licenses = "Apache-2.0 WITH LLVM-exception"
authors = ["Johannes Kanig <johannes.kanig@gmail.com>"]
maintainers = ["Johannes Kanig <johannes.kanig@gmail.com>"]
maintainers-logins = ["kanigsson"]
project-files = ["git_changes.gpr", "git_changes_cli.gpr"]
executables = ["git-changes"]
tags = ["git", "diff", "spark", "review"]

[[depends-on]]
gnat_native = "^16"
gprbuild = "^26"
[[depends-on]]
ore = "^0.5.0"

# No Alire index in this workspace; pin the sibling crate by path.
[[pins]]
ore = { path = "../../libs/ore" }

[build-switches]
"*".ada_version = "Ada2022"
Development.compile_checks = "warnings"
Development.contracts = "yes"
Release.optimization = "performance"
Release.runtime_checks = "everything"
