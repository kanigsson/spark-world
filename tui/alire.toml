name = "tui"
description = "Proved terminal-UI foundations: widths, line index, surface, key decoding, pager engine, app kit (SPARK, no I/O)"
version = "0.1.0-dev"

authors = ["kanig"]
maintainers = ["kanig <kanig@adacore.com>"]
maintainers-logins = ["kanig"]
licenses = "Apache-2.0"

project-files = ["tui.gpr"]

# No dependencies by design: nothing here touches the OS. The terminal driver
# is the separate tui_term crate, and it depends on this one, not the reverse.

[build-switches]
"*".contracts = "Yes"
