name = "tui_term"
description = "Terminal driver for the TUI ecosystem: raw mode, ANSI/SGR output, key input, signals (the OS edge)"
version = "0.1.0-dev"

authors = ["kanig"]
maintainers = ["kanig <kanig@adacore.com>"]
maintainers-logins = ["kanig"]
licenses = "Apache-2.0"

project-files = ["tui_term.gpr"]

[build-switches]
"*".contracts = "Yes"

[[depends-on]]
tui_core = "*"
[[depends-on]]
tui_surface = "*"
[[depends-on]]
tui_input = "*"

# No Alire index in this workspace; pin the sibling crates by path.
[[pins]]
tui_core = { path = "../core" }
[[pins]]
tui_surface = { path = "../surface" }
[[pins]]
tui_input = { path = "../input" }
